<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RISE — Get work. Get paid. Build Trust.</title>
<meta name="description" content="The platform where Nigerian creatives find real jobs, get paid without stress, and build a reputation that follows them everywhere."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --green:#39FF14;
  --green-dim:rgba(57,255,20,0.09);
  --green-mid:rgba(57,255,20,0.22);
  --bg:#080808;
  --bg2:#0e0e0e;
  --card:#131313;
  --card2:#1a1a1a;
  --line:rgba(255,255,255,0.07);
  --white:#fff;
  --dim:#555;
  --mid:#999;
  --head:'Plus Jakarta Sans',sans-serif;
  --body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.5}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(57,255,20,0.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(57,255,20,0.018) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 90% 50% at 50% 0%,black 30%,transparent 100%)}

.glow{position:fixed;top:-20%;left:50%;transform:translateX(-50%);
  width:900px;height:700px;
  background:radial-gradient(ellipse,rgba(57,255,20,0.055) 0%,transparent 65%);
  pointer-events:none;z-index:0;
  animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:0.7;transform:translateX(-50%) scale(1)}to{opacity:1;transform:translateX(-50%) scale(1.06)}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;
  height:60px;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(8,8,8,0.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);transition:border-color .3s}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo img{height:26px;width:auto}
.logo-text{font-family:var(--head);font-weight:800;font-size:19px;color:var(--white);letter-spacing:-0.025em}
.nav-right{display:flex;align-items:center;gap:10px}
.live-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;
  background:var(--green-dim);border:1px solid rgba(57,255,20,0.2);
  border-radius:100px;font-size:11px;font-weight:600;color:rgba(57,255,20,.75); /* Reduced green 15% */}
.live-badge i{width:5px;height:5px;border-radius:50%;background:var(--green);
  animation:pulse 2s ease-in-out infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.nav-btn{padding:9px 20px;border-radius:100px;background:var(--green);
  color:#000;font-weight:700;font-size:13px;text-decoration:none;
  transition:all .2s;font-family:var(--body)}
.nav-btn:hover{filter:brightness(1.08);transform:translateY(-1px);
  box-shadow:0 4px 20px rgba(57,255,20,0.3)}

/* HERO */
.hero{position:relative;z-index:1;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;
  padding:100px 32px 72px;max-width:1100px;margin:0 auto}
.hero-hi{font-size:15px;color:rgba(255,255,255,0.38);font-style:italic;
  margin-bottom:12px;opacity:0;animation:up .6s .05s ease both}
.hero-badge{display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:100px;
  background:var(--green-dim);border:1px solid rgba(57,255,20,0.2);
  font-size:12px;font-weight:600;color:rgba(57,255,20,.75); /* Update: Reduced green 15% */ margin-bottom:28px;
  opacity:0;animation:up .6s .1s ease both}
h1{font-family:var(--head);font-weight:800;
  font-size:clamp(52px,8.5vw,110px);line-height:.94;letter-spacing:-0.04em;
  margin-bottom:28px;opacity:0;animation:up .7s .15s ease both}
h1 span{display:block}
h1 .g{color:var(--green);text-shadow:0 0 70px rgba(57,255,20,0.2)}
.hero-p{font-size:clamp(16px,2vw,20px);color:var(--mid);max-width:520px;
  line-height:1.6;margin-bottom:40px;
  opacity:0;animation:up .7s .25s ease both}
.hero-p em{color:var(--green);font-style:italic}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:52px;
  opacity:0;animation:up .7s .35s ease both}
.btn-g{display:inline-flex;align-items:center;gap:8px;
  padding:15px 32px;border-radius:100px;background:var(--green);
  color:#000;font-weight:700;font-size:15px;text-decoration:none;
  transition:all .2s;box-shadow:0 0 32px rgba(57,255,20,0.15);font-family:var(--body)}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(57,255,20,0.28);filter:brightness(1.05)}
.btn-o{display:inline-flex;align-items:center;gap:8px;
  padding:15px 32px;border-radius:100px;background:transparent;
  border:1px solid rgba(255,255,255,0.11);color:var(--white);
  font-weight:600;font-size:15px;text-decoration:none;transition:all .2s;font-family:var(--body)}
.btn-o:hover{border-color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.03)}
.proof{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  opacity:0;animation:up .7s .45s ease both}
.avs{display:flex}
.av{width:32px;height:32px;border-radius:50%;border:2px solid var(--bg);
