/* HERO SECTION */
.rh{--lime:#b6ff3b;--ink:#fff;--mute:#b9c4bc;--card:#0f2216;--line:#24402c;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;min-height:640px;padding:36px clamp(24px,4.5vw,65px);color:var(--ink);font-family:Sora,system-ui,sans-serif}
.rh::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(520px 420px at 72% 55%,rgba(182,255,59,.16),transparent 70%),radial-gradient(380px 300px at 12% 100%,rgba(182,255,59,.07),transparent 70%)}
.rh *{box-sizing:border-box}

.copy{position:relative;z-index:3}
.tag{color:var(--lime);font-weight:800;font-size:13px;letter-spacing:.06em;margin:0 0 18px}
.rh h1{white-space:nowrap;font-size:clamp(38px,4.4vw,60px);line-height:.98;letter-spacing:-.045em;font-weight:800;margin:0 0 22px}
.rh h1 span{color:var(--lime);display:inline-flex;align-items:center;gap:14px}
.flag{width:44px;height:30px;border-radius:5px;display:inline-block;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.copy p.lead{max-width:440px;color:var(--mute);font-size:16px;line-height:1.6;margin:0 0 28px}
.lead b{color:var(--ink);font-weight:600}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:15px 26px;font:700 15px Sora,sans-serif;text-decoration:none;cursor:pointer;border:2px solid var(--lime);transition:transform .15s,box-shadow .15s}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.fill{background:var(--lime);color:#06100a}
.btn.fill:hover{box-shadow:0 0 28px rgba(182,255,59,.55);transform:translateY(-2px)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:rgba(182,255,59,.12)}
.play{width:26px;height:26px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.small{margin-top:16px;color:var(--mute);font-size:12px}

/* STAGE CONTAINER PERFECTED DESKTOP FIX */
.rh .stage {
  position: relative;
  width: 100%;
  max-width: 680px;
  height: 560px;
  margin: 0 auto;
  z-index: 2;
}

.rh .char {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 84%;
  z-index: 1;
  filter: drop-shadow(0 18px 24px rgba(0,0,0,.6));
}
.rh .char img {
  height: 100%;
  width: auto;
  display: block;
}

.rh .p1 {
  position: absolute;
  left: 200px;
  top: 14px;
  width: 255px;
  min-height: 510px;
  z-index: 3;
}

.rh .p2 {
  position: absolute;
  left: 425px;
  top: 110px;
  width: 215px;
  min-height: 440px;
  z-index: 2;
}

.rh .n1 {
  position: absolute;
  left: -10px;
  top: 36px;
  transform: rotate(-8deg);
  z-index: 4;
}
.rh .n2 {
  position: absolute;
  right: 15px;
  top: -10px;
  transform: rotate(7deg);
  z-index: 4;
}

.phone{position:absolute;display:flex;flex-direction:column;border-radius:40px;background:linear-gradient(160deg,#0a1a10,#050c08);border:3px solid #34463b;padding:12px 13px 10px;box-shadow:0 30px 60px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(182,255,59,.1)}
.notch{width:84px;height:22px;border-radius:99px;background:#000;margin:0 auto 4px}
.status{display:flex;justify-content:space-between;font-size:9px;font-weight:600;padding:0 14px 8px}
.plogo{font-weight:800;color:var(--lime);font-size:16px;letter-spacing:-.5px;margin:0 2px 6px;line-height:1}
.plogo small{display:block;font-size:5px;letter-spacing:.2em;color:var(--mute);font-weight:600;margin-top:2px}
.hi{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;line-height:1.25;margin:2px 2px 10px}
.av{width:34px;height:34px;border-radius:50%;border:2px solid var(--lime);background:radial-gradient(circle at 50% 26%,#1a1a1a 0 34%,transparent 35%),#a96a3b}
.score{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}

.srow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.num{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1}

.ring{position:relative;width:62px;height:62px;flex:none}
.ring>svg:first-child{transform:rotate(-90deg)}
.ring .ic2{position:absolute;inset:0;margin:auto;width:22px;height:22px;color:var(--lime)}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}

.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;min-height:100px}
.ic{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;color:var(--lime);background:linear-gradient(145deg,#2c4a1a,#0f2216);border:1px solid rgba(182,255,59,.45)}
.tile b{display:block;font-size:12px;margin:9px 0 3px;line-height:1.15}
.tile span{font-size:8.5px;color:var(--mute);line-height:1.3;display:block}
.tabs{display:flex;justify-content:space-between;margin:auto 4px 2px;padding-top:14px}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;color:var(--mute)}
.tabs .on{color:var(--lime)}.tabs .i{width:15px;height:15px}
.back{font-size:13px;font-weight:700;margin:6px 2px 12px}
.sus{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;position:relative}
.amt{font-size:24px;font-weight:800;margin:5px 0 2px;letter-spacing:-.5px}

.bar i{display:block;height:100%;background:var(--lime);border-radius:99px;width:0;animation:fill 1.6s .8s ease-out forwards}
.faces{display:flex;align-items:center;font-size:9px;color:var(--mute)}
.faces u{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);margin-right:-6px;background:radial-gradient(circle at 50% 28%,#1a1a1a 0 32%,transparent 33%),var(--c)}
.faces em{margin-left:12px;font-style:normal}
.cbtn{display:inline-block;background:var(--lime);color:#06100a;font-weight:800;font-size:10px;border-radius:99px;padding:7px 18px;margin-top:11px}
.ring.mini{position:absolute;right:11px;top:13px;width:46px;height:46px}
.goals h4{font-size:12px;margin:14px 2px 8px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:8px;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600}
.goal .ic{width:26px;height:26px;border-radius:8px}
.goal .gm{flex:1}.goal .bar{height:4px;margin:6px 0 0}
.goal b{color:var(--lime);font-size:11px}
.note{position:absolute;font-family:Caveat,cursive;font-size:28px;line-height:1.05;color:#fff;z-index:4;opacity:0;animation:pop .7s .9s forwards}

@keyframes pop{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
@keyframes fill{to{width:var(--w)}}

/* ===== The RISE Score ===== */
.rs{--lime:#b6ff3b;--ink:#fff;--mute:#b9c4bc;--card:#0f2216;--line:#24402c;font-family:Sora,system-ui,sans-serif;color:var(--ink);position:relative;border-top:1px solid #1b3020;overflow:hidden}
.rs *{box-sizing:border-box}

.rs-copy{grid-area:copy;position:relative;z-index:3;padding-bottom:56px}
.rs .eyebrow3{color:var(--lime);font-weight:800;font-size:12px;letter-spacing:.17em;margin:0 0 18px}
.rs h2{font-size:clamp(28px,3vw,42px);line-height:1.08;letter-spacing:-.04em;font-weight:800;margin:0 0 20px}
.rs p.body{max-width:400px;color:#d5ddd3;font-size:15px;line-height:1.7;margin:0 0 26px}
.rs .btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:15px 26px;font:700 14px Sora,sans-serif;text-decoration:none;background:var(--lime);color:#06100a;border:2px solid var(--lime);transition:transform .15s,box-shadow .15s}
.rs .btn:hover{box-shadow:0 0 28px rgba(182,255,59,.5);transform:translateY(-2px)}
.rs a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.rs-cards{grid-area:cards;position:relative;z-index:2;height:490px;width:100%;margin-bottom:56px}
.rs-cards::before{content:"";position:absolute;left:50%;top:48%;width:420px;height:420px;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(182,255,59,.2),rgba(182,255,59,.06) 60%,transparent 75%);pointer-events:none}
.rs-fc{position:absolute;z-index:3;background:linear-gradient(160deg,#112b18,#08170c);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 44px rgba(0,0,0,.55),0 0 40px rgba(182,255,59,.08);--r:0deg;--d:0s;transform:rotate(var(--r));animation:rsfloat 6.5s ease-in-out var(--d) infinite}
@keyframes rsfloat{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-8px) rotate(var(--r))}}
.rs-score{left:11%;top:136px;width:78%;padding:18px 18px 18px 20px;z-index:4;border-color:rgba(182,255,59,.45);box-shadow:0 26px 54px rgba(0,0,0,.6),0 0 70px rgba(182,255,59,.2);--r:-1deg;display:flex;align-items:center;justify-content:space-between;gap:12px}
.rs-score small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
