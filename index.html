<style>
:root { --lime: #b8ff45; --bg: #030b06; --muted: #c6cfc6; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: white; font-family: 'DM Sans', Arial, sans-serif; }
a { text-decoration: none; color: inherit; }
button, select { font: inherit; }
.shell { max-width: 1380px; margin: auto; }

/* HEADER & NAV */
.nav { height: 82px; padding: 0 clamp(24px, 4.5vw, 65px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1b3020; gap: 18px; }
.brand { display: flex; flex-direction: column; align-items: center; width: 112px; flex-shrink: 0; }
.brand img { height: 62px; width: 112px; object-fit: contain; }
.brand span { font-size: 10px; font-weight: 800; letter-spacing: .38em; margin-left: .38em; }
.links { display: flex; gap: clamp(12px, 2vw, 28px); align-items: center; }
.links a { font-size: 12px; font-weight: 700; white-space: nowrap; }
.links a.active { color: var(--lime); border-bottom: 2px solid var(--lime); padding-bottom: 9px; }

/* LANGUAGE FLOATER BADGE */
.lang-select-wrap { display: inline-flex; align-items: center; gap: 8px; position: relative; }
.lang-hint-badge { font-size: 10px; font-weight: 800; color: #06100a; background: var(--lime); padding: 4px 10px; border-radius: 99px; white-space: nowrap; letter-spacing: .02em; text-transform: uppercase; }
.lang-select-box { position: relative; display: inline-flex; align-items: center; }
.lang-select { background: #0b1d11; color: var(--lime); border: 1px solid #31533a; border-radius: 20px; padding: 6px 28px 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer; outline: none; -webkit-appearance: none; appearance: none; }
.lang-select-box::after { content: "▾"; font-size: 10px; color: var(--lime); position: absolute; right: 10px; pointer-events: none; }
.lang-select:focus-visible { border-color: var(--lime); }

.cta { background: var(--lime); color: #091005; border-radius: 40px; padding: 16px 26px; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
.mobile-toggle { display: none; background: transparent; border: 1px solid #3c5839; color: white; border-radius: 8px; padding: 8px 12px; }

@media(max-width:1050px) { .links { gap: 12px; } }
@media(max-width:760px) {
  .nav { height: 76px; padding: 0 18px; }
  .brand { width: 85px; }
  .brand img { height: 37px; }
  .mobile-toggle { display: block; margin-left: auto; }
  .nav > .cta { padding: 11px 14px; font-size: 10px; }
  .links { display: none; position: absolute; top: 76px; left: 0; right: 0; background: #08130b; padding: 22px; flex-direction: column; align-items: flex-start; z-index: 20; border-bottom: 1px solid #315034; }
  .links.open { display: flex; }
  .links .lang-select-wrap { margin-top: 10px; }
}

/* HERO SECTION - LAYOUT LOCK */
.rh { --lime: #b6ff3b; --ink: #fff; --mute: #b9c4bc; --card: #0f2216; --line: #24402c; position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr 1.1fr; align-items: center; min-height: 620px; padding: 36px clamp(24px, 4.5vw, 65px); color: var(--ink); font-family: Sora, system-ui, sans-serif; }
.rh::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(520px 420px at 72% 55%, rgba(182, 255, 59, .16), transparent 70%), radial-gradient(380px 300px at 12% 100%, rgba(182, 255, 59, .07), transparent 70%); }
.rh * { box-sizing: border-box; }

.copy { position: relative; z-index: 3; max-width: 520px; }
.tag { color: var(--lime); font-weight: 800; font-size: 13px; letter-spacing: .06em; margin: 0 0 18px; }
.rh h1 { white-space: normal !important; font-size: clamp(34px, 3.8vw, 54px); line-height: 1.05; letter-spacing: -.04em; font-weight: 800; margin: 0 0 22px; word-break: break-word; }
.rh h1 span { color: var(--lime); display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.flag { width: 44px; height: 30px; border-radius: 5px; display: inline-block; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, .2); }
.copy p.lead { max-width: 440px; color: var(--mute); font-size: 16px; line-height: 1.6; margin: 0 0 28px; }
.lead b { color: var(--ink); font-weight: 600; }
.btns { display: flex; gap: 14px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 15px 26px; font: 700 15px Sora, sans-serif; text-decoration: none; cursor: pointer; border: 2px solid var(--lime); transition: transform .15s, box-shadow .15s; }
.btn.fill { background: var(--lime); color: #06100a; }
.btn.fill:hover { box-shadow: 0 0 28px rgba(182, 255, 59, .55); transform: translateY(-2px); }
.small { margin-top: 16px; color: var(--mute); font-size: 12px; }

/* STAGE GRAPHICS CONTAINER */
.rh .stage { position: relative; width: 100%; max-width: 580px; height: 540px; margin: 0 0 0 auto; z-index: 2; }
.rh .char { position: absolute; left: 0; bottom: 0; height: 84%; z-index: 3; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .6)); }
.rh .char img { height: 100%; width: auto; display: block; }
.rh .p1 { position: absolute; left: 190px; top: 15px; width: 240px; min-height: 490px; z-index: 2; }
.rh .p2 { position: absolute; left: 360px; top: 85px; width: 200px; min-height: 420px; z-index: 1; }
.rh .n1 { position: absolute; left: -5px; top: 20px; transform: rotate(-8deg); z-index: 4; }
.rh .n2 { position: absolute; right: 10px; top: 5px; transform: rotate(7deg); z-index: 4; }

.phone { position: absolute; display: flex; flex-direction: column; border-radius: 40px; background: linear-gradient(160deg, #0a1a10, #050c08); border: 3px solid #34463b; padding: 12px 13px 10px; box-shadow: 0 30px 60px rgba(0, 0, 0, .65), inset 0 0 0 1px rgba(255, 255, 255, .08), 0 0 60px rgba(182, 255, 59, .1); }
.notch { width: 84px; height: 22px; border-radius: 99px; background: #000; margin: 0 auto 4px; }
.status { display: flex; justify-content: space-between; font-size: 9px; font-weight: 600; padding: 0 14px 8px; }
.plogo { font-weight: 800; color: var(--lime); font-size: 16px; letter-spacing: -.5px; margin: 0 2px 6px; line-height: 1; }
.plogo small { display: block; font-size: 5px; letter-spacing: .2em; color: var(--mute); font-weight: 600; margin-top: 2px; }
.hi { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; line-height: 1.25; margin: 2px 2px 10px; }
.av { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--lime); background: radial-gradient(circle at 50% 26%, #1a1a1a 0 34%, transparent 35%), #a96a3b; }
.score { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.score small, .sub { font-size: 10px; color: var(--mute); }
.srow { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.num { font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.pill { display: inline-block; background: var(--lime); color: #06100a; font-size: 8px; font-weight: 800; border-radius: 99px; padding: 3px 8px; margin-left: 6px; vertical-align: middle; }
.ring { position: relative; width: 62px; height: 62px; flex: none; }
.ring > svg:first-child { transform: rotate(-90deg); }
.ring .ic2 { position: absolute; inset: 0; margin: auto; width: 22px; height: 22px; color: var(--lime); }
.ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring .bg { stroke: #1c3324; }
.ring .fg { stroke: var(--lime); }
.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 10px; min-height: 100px; }
.ic { width: 30px; height: 30px; border-radius: 99px; display: grid; place-items: center; color: var(--lime); background: linear-gradient(145deg, #2c4a1a, #0f2216); border: 1px solid rgba(182, 255, 59, .45); }
.tile b { display: block; font-size: 12px; margin: 9px 0 3px; line-height: 1.15; }
.tile span { font-size: 8.5px; color: var(--mute); line-height: 1.3; display: block; }
.tabs { display: flex; justify-content: space-between; margin: auto 4px 2px; padding-top: 14px; }
.tabs div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 8px; color: var(--mute); }
.tabs .on { color: var(--lime); }
.tabs .i { width: 15px; height: 15px; }
.back { font-size: 13px; font-weight: 700; margin: 6px 2px 12px; }
.sus { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px; position: relative; }
.amt { font-size: 24px; font-weight: 800; margin: 5px 0 2px; letter-spacing: -.5px; }
.bar { height: 6px; border-radius: 99px; background: #1c3324; overflow: hidden; margin: 10px 0; }
.bar i { display: block; height: 100%; background: var(--lime); border-radius: 99px; width: 0; animation: fill 1.6s .8s ease-out forwards; }
.faces { display: flex; align-items: center; font-size: 9px; color: var(--mute); }
.faces u { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--card); margin-right: -6px; background: radial-gradient(circle at 50% 28%, #1a1a1a 0 32%, transparent 33%), var(--c); }
.faces em { margin-left: 12px; font-style: normal; }
.cbtn { display: inline-block; background: var(--lime); color: #06100a; font-weight: 800; font-size: 10px; border-radius: 99px; padding: 7px 18px; margin-top: 11px; }
.ring.mini { position: absolute; right: 11px; top: 13px; width: 46px; height: 46px; }
.goals h4 { font-size: 12px; margin: 14px 2px 8px; }
.goal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600; }
.goal .ic { width: 26px; height: 26px; border-radius: 8px; }
.goal .gm { flex: 1; }
.goal .bar { height: 4px; margin: 6px 0 0; }
.goal b { color: var(--lime); font-size: 11px; }
.note { position: absolute; font-family: Caveat, cursive; font-size: 28px; line-height: 1.05; color: #fff; z-index: 4; opacity: 0; animation: pop .7s .9s forwards; }

@keyframes pop { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
@keyframes fill { to { width: var(--w); } }

@media (max-width: 1180px) {
  .rh .p1 { left: 160px; width: 220px; }
  .rh .p2 { left: 320px; width: 180px; }
  .rh .char { height: 76%; }
}

@media (max-width: 960px) {
  .rh { grid-template-columns: 1fr; padding: 20px 20px 36px; }
  .copy { max-width: 100%; }
  .rh .stage { height: 480px; max-width: 440px; margin: 20px auto 0; }
  .rh .p1 { left: calc(50% - 50px); top: 20px; width: 190px; z-index: 3; }
  .rh .p2 { display: none; }
  .rh .char { height: 58%; left: -2%; z-index: 2; }
}

@media (max-width: 560px) {
  .rh .stage { height: 500px; max-width: 420px; margin: 12px auto 0; }
  .rh .p1 { top: 30px; left: calc(50% - 20px); width: 182px; min-height: 430px; }
  .rh .char { left: -2%; bottom: 0; height: 250px; z-index: 4; }
  .rh .note { font-size: 18px; line-height: 1.05; }
  .rh .n1 { top: 0; left: 2%; }
  .rh .n2 { top: 0; right: 2%; }
}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .note { opacity: 1; } .bar i { width: var(--w); } }

.woman { position: absolute; left: -3%; bottom: 0; height: 86%; z-index: 2; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .6)); }
.woman img { height: 100%; width: auto; display: block; }
.ri .note2 { position: absolute; left: 4%; top: 0; white-space: nowrap
